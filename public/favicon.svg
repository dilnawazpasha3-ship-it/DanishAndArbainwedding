<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="16" fill="#0A0A0C"/>
  <circle cx="32" cy="32" r="27" stroke="url(#goldGradient)" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="23" stroke="url(#goldGradient)" stroke-width="0.8" stroke-dasharray="2 2"/>
  <!-- Eight point Islamic Star (Rub El Hizb) -->
  <g transform="translate(32 32) scale(0.65)">
    <rect x="-16" y="-16" width="32" height="32" stroke="url(#goldGradient)" stroke-width="1.5" fill="none"/>
    <rect x="-16" y="-16" width="32" height="32" stroke="url(#goldGradient)" stroke-width="1.5" fill="none" transform="rotate(45)"/>
    <circle cx="0" cy="0" r="6" fill="url(#goldGradient)"/>
  </g>
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E296"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9A7B2C"/>
    </linearGradient>
  </defs>
</svg>